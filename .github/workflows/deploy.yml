name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: URLs aus Secrets einsetzen
        env:
          CREDITS_URL: ${{ secrets.CREDITS_URL }}
          STATS_URL:   ${{ secrets.STATS_URL }}
        run: |
          set -euo pipefail
          sed -i "s|__CREDITS_URL__|${CREDITS_URL}|g" index.html
          sed -i "s|__STATS_URL__|${STATS_URL}|g"     index.html
          # Fehlt ein Secret, bliebe der Platzhalter stehen -> lieber abbrechen
          # als eine kaputte Seite zu veroeffentlichen.
          if grep -n "__CREDITS_URL__\|__STATS_URL__" index.html; then
            echo "::error::Mindestens ein Secret fehlt (CREDITS_URL / STATS_URL)."
            exit 1
          fi

      - name: Sicherungen nicht mit veroeffentlichen
        run: rm -f *.backup-*.html landing.backup-*.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - uses: actions/deploy-pages@v4
        id: deployment
